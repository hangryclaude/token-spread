<svg width="760" height="380" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="380" fill="#fcfcfb"/><text x="70" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="750" fill="#1f2937">Routing is a dial you choose</text><text x="70" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#64748b">Routing-only savings vs % of routine work sent to Haiku. x: % routed · y: $/mo saved</text><text x="70" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">Linear for this single-model example — real mixed traffic bends it. The report shows the whole curve, never one promised number.</text><line x1="70" y1="314.0" x2="736" y2="314.0" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="318.0" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">$0</text><line x1="70" y1="252.0" x2="736" y2="252.0" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="256.0" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">$150</text><line x1="70" y1="190.0" x2="736" y2="190.0" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="194.0" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">$300</text><line x1="70" y1="128.0" x2="736" y2="128.0" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="132.0" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">$450</text><line x1="70" y1="66.0" x2="736" y2="66.0" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="70.0" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">$600</text><text x="70.0" y="336.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">0%</text><text x="236.5" y="336.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">25%</text><text x="403.0" y="336.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">50%</text><text x="569.5" y="336.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">75%</text><text x="736.0" y="336.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">100%</text><path d="M 70 314 L 336.40000000000003 214.8 L 336.40000000000003 314 L 70 314 Z" fill="#4f46e5" fill-opacity="0.12"/><line x1="70" y1="314" x2="736" y2="66" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/><line x1="336.40000000000003" y1="314" x2="336.40000000000003" y2="214.8" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="336.40000000000003" cy="214.8" r="6" fill="#4f46e5" stroke="#fcfcfb" stroke-width="2"/><text x="348.4" y="206.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2937">40% → $240/mo</text><text x="348.4" y="222.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">the point we chose</text></svg>