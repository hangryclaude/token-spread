<!doctype html>
<html><head><meta charset="utf-8"><title>The bar</title><style>
  /* IBM Plex, self-hosted from site/assets/fonts — SIL OFL 1.1, same as docs/img/banner.html.
     Rendered to frames, so the film carries no font dependency of its own. */
  @font-face{font-family:'IBM Plex Sans';src:url('../../site/assets/fonts/plex-sans-var.woff2') format('woff2');
    font-weight:400 700;font-style:normal}
  @font-face{font-family:'IBM Plex Mono';src:url('../../site/assets/fonts/plex-mono-400.woff2') format('woff2');
    font-weight:400;font-style:normal}
  @font-face{font-family:'IBM Plex Mono';src:url('../../site/assets/fonts/plex-mono-600.woff2') format('woff2');
    font-weight:600;font-style:normal}
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c1110; --line:#26302e; --ink:#eef3f1; --ink2:#9fb2ab; --ink3:#6d817a;
    --acc:#3ddc84; --amber:#d6a544; --red:#e57866; --grey:#6d817a;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  body{width:1280px;height:720px;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'IBM Plex Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
    position:relative}
  #stage{position:absolute;inset:0}
  canvas{position:absolute;inset:0}
  .lyr{position:absolute;inset:0;padding:64px 88px;display:flex;flex-direction:column;
    justify-content:center}
  .kicker{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--acc)}
  .q{font-size:40px;line-height:1.24;letter-spacing:-.02em;max-width:25ch;margin-top:26px;font-weight:600}
  .q em{font-style:normal;color:var(--ink3)}
  .clause{display:block;margin-bottom:.46em}
  .clause:last-child{margin-bottom:0}
  .verdict{font-size:26px;color:var(--ink2);margin-top:26px;max-width:30ch;line-height:1.45}
  .verdict b{color:var(--ink);font-weight:600}
  /* Legend sits under the dot field in the sort beat. */
  #legend{position:absolute;left:88px;right:88px;bottom:74px;display:flex;gap:0;
    justify-content:space-between}
  .leg{flex:1;text-align:center}
  .leg .n{font-family:var(--mono);font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .leg .l{font-family:var(--mono);font-size:13px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink3);margin-top:12px;line-height:1.5}
  #sum{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-family:var(--mono);
    font-size:19px;color:var(--ink2);letter-spacing:.04em}
  #title{position:absolute;left:0;right:0;top:96px;text-align:center;font-family:var(--mono);
    font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
  #headline{position:absolute;left:0;right:0;top:138px;text-align:center;font-size:46px;
    font-weight:600;letter-spacing:-.025em;color:var(--ink)}
</style></head><body>

<div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>

  <div class="lyr" id="ask">
    <p class="kicker">One question decides every one</p>
    <p class="q">
      <span class="clause" data-c="0">Does the model read a different sequence of tokens?</span>
      <span class="clause" data-c="1">Does a different model answer?</span>
      <span class="clause" data-c="2">Does a different amount of thinking happen?</span>
    </p>
    <p class="verdict">If the answer is yes, it is not a saving.<br>
      It is <b>a changed product sold as one</b>.</p>
  </div>

  <div id="title">The register</div>
  <div id="headline"></div>
  <div id="legend"></div>
  <div id="sum"></div>
</div>

<script>
/* Deterministic by construction: nothing here reads a clock. The renderer calls setT(t) with
   t in [0,1], the whole frame is a pure function of t, and every frame is therefore
   reproducible — which is the only way a film of a correctness claim can itself be checked.
   The four counts are injected by the renderer from verdicts-final.json rather than typed
   here, because a hand-typed tally in an explainer is the exact defect this explainer is about. */
const C = document.getElementById('c'), X = C.getContext('2d');
const clauses = [...document.querySelectorAll('.clause')];
const ask = document.getElementById('ask'), legendEl = document.getElementById('legend');
const titleEl = document.getElementById('title'), sumEl = document.getElementById('sum');

let GROUPS = [];       // [{key,label,n,color}] — set by setData()
let dots = [];         // one per candidate, with a home column
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const ease = (u)=>u<=0?0:u>=1?1:1-Math.pow(1-u,3);
/* A frame-window helper: 0 before `a`, eased 0->1 across [a,b], 1 after. */
const seg = (t,a,b)=>ease(clamp((t-a)/(b-a),0,1));

/* Deterministic pseudo-random: the scatter must be identical on every render, and
   Math.random would make two runs of the same film differ. */
let seed = 20260812;
const rnd = ()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };

function applyData(groups){
  GROUPS = groups;
  seed = 20260812;
  dots = [];
  groups.forEach((g,gi)=>{
    for(let i=0;i<g.n;i++) dots.push({g:gi, sx:rnd(), sy:rnd(), j:rnd()});
  });
  legendEl.innerHTML = groups.map(g=>
    `<div class="leg"><div class="n" style="color:${g.color}">${g.n}</div>
     <div class="l">${g.label}</div></div>`).join('');
  const tot = groups.reduce((a,g)=>a+g.n,0);
  sumEl.textContent = groups.map(g=>g.n).join(' + ') + ' = ' + tot;
  document.getElementById('headline').textContent = tot + ' techniques. ' + groups[0].n + ' survive.';
}

/* Column centres for the sorted state, matching the legend's flex layout exactly so a dot
   column sits above its own number. */
function colX(gi){
  const L=88, R=1280-88, w=(R-L)/GROUPS.length;
  return L + w*gi + w/2;
}

function setT(t){
  X.clearRect(0,0,1280,720);

  /* ---- Beat 1: the question, one clause at a time ---------------------------------- */
  const askOut = seg(t,0.30,0.38);
  ask.style.opacity = (1-askOut).toFixed(3);
  ask.style.transform = `translateY(${(-26*askOut).toFixed(2)}px)`;
  clauses.forEach((el,i)=>{
    const a = seg(t, 0.02+i*0.055, 0.10+i*0.055);
    el.style.opacity = (0.12+0.88*a).toFixed(3);
    el.style.transform = `translateY(${(10*(1-a)).toFixed(2)}px)`;
  });
  document.querySelector('.verdict').style.opacity = seg(t,0.20,0.28).toFixed(3);

  /* ---- Beat 2: 176 candidates arrive as one undifferentiated cloud ----------------- */
  const arrive = seg(t,0.34,0.52);
  /* ---- Beat 3: the cloud sorts into four columns ----------------------------------- */
  const sort = seg(t,0.55,0.80);

  const cloudCx=640, cloudCy=352, cloudW=560, cloudH=250;
  dots.forEach((d,i)=>{
    const per = clamp((arrive - d.j*0.35)/0.65, 0, 1);
    if(per<=0) return;
    const cx = cloudCx + (d.sx-0.5)*cloudW;
    const cy = cloudCy + (d.sy-0.5)*cloudH;

    /* Sorted position: a tidy column per group, filling bottom-up. */
    const g = GROUPS[d.g];
    const idxIn = d.iIn;
    const perRow = 8, gap = 15;
    const row = Math.floor(idxIn/perRow), col = idxIn%perRow;
    const tx = colX(d.g) + (col-(perRow-1)/2)*gap;
    const ty = 470 - row*gap;

    const s = ease(clamp((sort - d.j*0.18)/0.82, 0, 1));
    const x = cx + (tx-cx)*s, y = cy + (ty-cy)*s;

    X.globalAlpha = per * (0.34 + 0.66*s);
    X.fillStyle = s<0.02 ? '#9fb2ab' : g.color;
    X.beginPath(); X.arc(x, y, 4.1, 0, 6.2832); X.fill();
  });
  X.globalAlpha = 1;

  /* ---- Beat 4: the counts, then the line that proves nothing was dropped ----------- */
  titleEl.style.opacity = seg(t,0.36,0.44).toFixed(3);
  const hl = document.getElementById('headline');
  const ha = seg(t,0.40,0.50);
  hl.style.opacity = ha.toFixed(3);
  hl.style.transform = `translateY(${(14*(1-ha)).toFixed(2)}px)`;
  [...legendEl.children].forEach((el,i)=>{
    const a = seg(t, 0.70+i*0.035, 0.78+i*0.035);
    el.style.opacity = a.toFixed(3);
    el.style.transform = `translateY(${(12*(1-a)).toFixed(2)}px)`;
  });
  sumEl.style.opacity = seg(t,0.88,0.97).toFixed(3);
}

/* Index each dot within its own group once, so the sorted grid is stable across frames. */
function indexDots(){
  const seen = new Array(GROUPS.length).fill(0);
  dots.forEach(d=>{ d.iIn = seen[d.g]++; });
}

window.setData = (g)=>{ applyData(g); indexDots(); setT(0); };
window.setT = setT;
window.__ready = true;
</script>
</body></html>
