<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:#FFFFFF;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#131313;display:flex;flex-direction:column;justify-content:center;padding:76px 80px}
  .art{position:absolute;inset:0;z-index:0}
  .art img{width:100%;height:100%;object-fit:cover;object-position:70% 45%}
  .art::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to right,#FFFFFF 0%,#FFFFFF 46%,rgba(255,255,255,0) 82%)}
  .c{position:relative;z-index:1;max-width:740px}
  .brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:600;
    letter-spacing:-.02em;margin-bottom:40px}
  .dot{width:15px;height:15px;border-radius:50%;background:#0B7A4B}
  h1{font-size:78px;line-height:1.0;letter-spacing:-.045em;font-weight:700}
  h1 em{font-style:normal;color:#5A625C}
  p{font-size:27px;color:#4C544E;margin-top:26px;line-height:1.4;max-width:22ch}
  .rates{display:flex;gap:14px;margin-top:44px}
  .r{background:#F4F7F5;border-radius:16px;padding:16px 22px}
  .r b{display:block;font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .r span{font-size:15px;color:#4C544E}
  .r.on b{color:#0B7A4B}
</style>
</head>
<body>
  <div class="art"><img src="img/hero-a.avif" alt=""></div>
  <div class="c">
    <div class="brand"><span class="dot"></span>idemlayer</div>
    <h1>The same output.<br><em>A smaller bill.</em></h1>
    <p>We measure your Claude cache-hit rate free. Same model, same tokens.</p>
    <div class="rates">
      <div class="r"><b>$5.00</b><span>standard</span></div>
      <div class="r on"><b>$0.50</b><span>cache read</span></div>
      <div class="r on"><b>none</b><span>quality change</span></div>
    </div>
  </div>
</body>
</html>
