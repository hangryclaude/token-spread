<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
  /* Mirrors the live hero: centred, weight 485, letter-spacing -.012em, and the
     same CSS orb field rather than a bitmap — so a copy change on the page and a
     regenerated card cannot drift apart in type or colour. Screenshot at 1200x630. */
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:#FFFFFF;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#131313;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:56px 80px}
  #orbs{position:absolute;inset:0;overflow:hidden}
  .orb{position:absolute;border-radius:50%}
  .c{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
    text-align:center}
  .brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:535;
    letter-spacing:-.022em;margin-bottom:34px}
  .dot{width:13px;height:13px;border-radius:50%;background:#19BB77}
  h1{font-size:76px;line-height:1.1875;letter-spacing:-.012em;font-weight:485}
  .card{margin-top:34px;background:#F9F9F9;border-radius:24px;padding:6px;width:520px;
    display:flex;flex-direction:column;gap:4px;text-align:left}
  .row{background:#FFFFFF;border-radius:20px;padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between}
  .row .lab{font-size:14px;color:rgba(19,19,19,.63);display:block;margin-bottom:2px}
  .row .amt{font-size:31px;font-weight:485;letter-spacing:-.028em;
    font-variant-numeric:tabular-nums;line-height:1.15}
  .row .amt.out{color:#0B7A4B}
  .chip{background:#F2F2F2;border-radius:999px;padding:7px 14px;font-size:14px;
    font-weight:535;white-space:nowrap}
  p.sub{font-size:19px;color:#131313;margin-top:30px}
</style>
</head>
<body>
  <div id="orbs"></div>
  <div class="c">
    <div class="brand"><span class="dot"></span>idemlayer</div>
    <h1>The same output.<br>A smaller bill.</h1>
    <div class="card">
      <div class="row">
        <div><span class="lab">You spend now</span><span class="amt">$40,000</span></div>
        <span class="chip">per month</span>
      </div>
      <div class="row">
        <div><span class="lab">You'd spend</span><span class="amt out">$17,967</span></div>
        <span class="chip">same output</span>
      </div>
    </div>
    <p class="sub">Same model, same tokens. We measure your cache-hit rate free.</p>
  </div>
<script type="module">
import { initOrbField } from "./orbfield.js";
initOrbField(document.getElementById("orbs"),
  { count: 30, seed: 424242, drift: false, scale: .9,
    keepOut: { x0: 27, x1: 73, y0: 4, y1: 96 } });
</script>
</body>
</html>
